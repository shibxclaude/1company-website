# 一零科技官网 nginx 配置 —— HTTPS 阶段（微信支付回调必须是 HTTPS）
# 启用步骤：
#   1) yilinga.com 证书放到 /etc/nginx/ssl/yilinga.com.pem 与 /etc/nginx/ssl/yilinga.com.key
#      （证书需同时覆盖 www.yilinga.com 和 yilinga.com；文件名不同就改下面两行 ssl_certificate）
#   2) cp cn01-base.inc cn01-site.inc /etc/nginx/snippets/
#   3) rm /etc/nginx/conf.d/cn01.conf && cp cn01-https.conf /etc/nginx/conf.d/
#   4) nginx -t && nginx -s reload
# HSTS 先用 1 天观察，确认全站 HTTPS 无问题后再改为 31536000。

include /etc/nginx/snippets/cn01-base.inc;

# 后端 Spring Boot（systemd 部署）
upstream cn01_backend {
    server 127.0.0.1:8080;
}

# HTTP 一律跳转 https://www.yilinga.com（含旧域名 cn01.com.cn；保留 ACME 校验路径，便于自动续期证书）
server {
    listen 80;
    server_name www.yilinga.com yilinga.com www.cn01.com.cn cn01.com.cn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://www.yilinga.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.yilinga.com yilinga.com;

    ssl_certificate     /etc/nginx/ssl/yilinga.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yilinga.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cn01_ssl:10m;
    ssl_session_timeout 1d;

    # 与 cn01-site.inc 中的 add_header 同属 server 级，会一并输出
    add_header Strict-Transport-Security "max-age=86400" always;

    # 主域名 www.yilinga.com：yilinga.com 与旧域名 cn01.com.cn / www.cn01.com.cn 一律 301 过来
    if ($host != www.yilinga.com) {
        return 301 $scheme://www.yilinga.com$request_uri;
    }
    include /etc/nginx/snippets/cn01-site.inc;
}

# 旧域名的 https://cn01.com.cn 访问：需要 cn01.com.cn 的证书，见 cn01-legacy-https.conf（可选）
