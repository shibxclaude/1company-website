# 一零科技官网 nginx 配置 —— HTTP 阶段（证书就绪之前使用）
# 目录约定（由 deploy/deploy.sh 维护）：
#   /var/www/cn01/releases/<时间戳>/{www,admin}   每次发布一个目录
#   /var/www/cn01/current -> releases/<时间戳>    软链接，切换即发布/回滚
#   /var/www/cn01/uploads                         后台上传的图片（不随版本切换）
#   后端 Spring Boot 监听 127.0.0.1:8080
#
# 安装（deploy/server-init.sh 已包含）：
#   cp cn01-base.inc cn01-site.inc /etc/nginx/snippets/
#   cp cn01.conf /etc/nginx/conf.d/ && nginx -t && nginx -s reload
# 证书就绪后：用 cn01-https.conf 替换本文件（两个文件只能装一个），见该文件说明。

include /etc/nginx/snippets/cn01-base.inc;

server {
    listen 80;
    server_name www.cn01.com.cn cn01.com.cn;
    include /etc/nginx/snippets/cn01-site.inc;
}
