# 一零科技官网 nginx 配置
# 目录约定（由 deploy/deploy.sh 维护）：
#   /var/www/cn01/releases/<时间戳>/{www,admin}   每次发布一个目录
#   /var/www/cn01/current -> releases/<时间戳>    软链接，切换即发布/回滚
#   /var/www/cn01/uploads                         后台上传的图片（不随版本切换）
#   后端 Spring Boot 监听 127.0.0.1:8080
#
# 安装：cp cn01.conf /etc/nginx/conf.d/ && nginx -t && nginx -s reload
# HTTPS：证书就绪后启用文件末尾的 443 server，并把 80 改为 301 跳转。

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

# 缓存策略按路径决定，统一在 server 级输出。
# 注意：location 里一旦写 add_header，server 级的 add_header 会全部失效，所以下面的 location 都不写 add_header。
map $uri $cn01_cache_control {
    default                 "no-cache";                              # HTML：每次协商，改价/改内容后立即生效
    ~^/assets/              "public, max-age=31536000, immutable";   # 构建产物带内容哈希
    ~^/admin/assets/        "public, max-age=31536000, immutable";
    ~^/uploads/             "public, max-age=2592000";               # 上传文件名随机生成，内容不会变
    ~^/api/                 "no-store";                              # 接口不缓存（价格即时生效）
    ~^/images/              "public, max-age=2592000";               # 图片 30 天（替换图片请改文件名）
    ~^/favicon\.png$        "public, max-age=2592000";
    ~^/(sitemap\.xml|robots\.txt)$ "public, max-age=3600";
}

server {
    listen 80;
    server_name www.cn01.com.cn cn01.com.cn;

    # 裸域名统一到 www
    if ($host = cn01.com.cn) {
        return 301 $scheme://www.cn01.com.cn$request_uri;
    }

    root /var/www/cn01/current/www;
    charset utf-8;
    server_tokens off;

    add_header Cache-Control $cn01_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location = /favicon.png { access_log off; }
    location = /robots.txt  { access_log off; }

    # 预渲染产物的物理路径不对外暴露：/index.html -> /，/about/index.html -> /about
    location = /index.html { return 301 /; }
    location ~ ^(.+)/index\.html$ { return 301 $1; }

    # 统一去掉结尾斜杠：/about/ -> /about（canonical 也不带斜杠）
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # 只在客户端渲染的路由（不做预渲染）：返回空壳页，由前端路由渲染
    location ~ ^/(user|order|pay)(/|$) {
        try_files /spa.html =404;
    }

    # 解决方案/新闻详情：优先返回预渲染页面；后台新上架、尚未重新构建的，返回空壳页由前端渲染（无需发版即可访问）
    location ~ ^/(solutions|news)/[^/]+$ {
        try_files $uri/index.html /spa.html;
    }

    # 后端接口
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 20m;
    }

    # 后台上传的图片
    location ^~ /uploads/ {
        alias /var/www/cn01/uploads/;
        try_files $uri =404;
    }

    # 管理后台（独立 SPA）
    location ^~ /admin/ {
        root /var/www/cn01/current;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin { return 301 /admin/; }

    # 预渲染页面：/about -> /about/index.html
    location / {
        try_files $uri $uri/index.html =404;
    }

    # 不存在的地址：返回 404 状态码 + 空壳页（前端显示 404 页面）
    error_page 404 /spa.html;
    location = /spa.html {
        internal;
    }

}

