# 旧域名 https://cn01.com.cn / https://www.cn01.com.cn 跳转到 https://www.yilinga.com（可选）
# 只有手里有 cn01.com.cn 的有效证书时才安装本文件：
#   证书放到 /etc/nginx/ssl/cn01.com.cn.pem 与 .key（覆盖 cn01.com.cn 和 www.cn01.com.cn）
#   cp cn01-legacy-https.conf /etc/nginx/conf.d/ && nginx -t && nginx -s reload
# 不安装时：http://cn01.com.cn 仍会经 cn01-https.conf 的 80 端口跳转到新域名；
# https://cn01.com.cn 则会落到 yilinga.com 的证书上，浏览器报证书不匹配。

server {
    listen 443 ssl;
    http2 on;
    server_name www.cn01.com.cn cn01.com.cn;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/cn01.com.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/cn01.com.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.yilinga.com$request_uri;
}
