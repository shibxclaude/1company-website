# 一零科技官网 nginx 配置 —— Docker Compose 部署（后端在容器里，nginx 用宿主机系统自带的）
# 适用于还没有切换域名解析的服务器：用 http://<服务器IP>:8088 访问，不做主域名跳转，不占用 80 端口上已有的站点。
# 正式切换到 www.yilinga.com 时改用 cn01.conf / cn01-https.conf，并把其中 upstream 的端口改成 BACKEND_PORT。
#
# 目录约定与 cn01.conf 相同（/var/www/cn01/current/{www,admin}、/var/www/cn01/uploads）。
# 安装（deploy/compose-deploy.sh 已包含）：
#   cp cn01-base.inc cn01-site.inc /etc/nginx/snippets/
#   cp cn01-docker.conf /etc/nginx/conf.d/ && nginx -t && nginx -s reload

include /etc/nginx/snippets/cn01-base.inc;

# 后端容器发布在 127.0.0.1:BACKEND_PORT（见 .env，默认 18080）
upstream cn01_backend {
    server 127.0.0.1:18080;
}

server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    include /etc/nginx/snippets/cn01-site.inc;
}
